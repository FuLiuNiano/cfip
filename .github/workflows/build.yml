name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/nodesCatch.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src/bin/Release/net48/CFip.exe $out/
          Copy-Item src/bin/Release/net48/Newtonsoft.Json.dll $out/
          Copy-Item src/bin/Release/net48/System.Resources.Extensions.dll $out/
          Copy-Item tools/启动助手.bat $out/
          Copy-Item tools/bom_proxy.py $out/
          Compress-Archive -Path "$out/*" -DestinationPath CFip-v2.1-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CFip-build
          path: CFip-v2.1-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CFip-v2.1-win64.zip
